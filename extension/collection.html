<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>MagnoGrabr Collection</title>
    <link rel="stylesheet" href="ui.css">
  </head>
  <body class="extension-popup">
    <main class="app-shell">
      <header class="page-header">
        <div><p class="eyebrow">MAGNOGRABR</p><h1>Your collection</h1><p id="summary">Your saved links</p></div>
        <div class="header-actions">
          <button class="icon-button" id="settings" aria-label="Open settings">⚙</button>
          <button class="icon-button" id="refresh" aria-label="Refresh collection">↻</button>
        </div>
      </header>
      <label class="page-tools-toggle">
        <span><strong>Page tools</strong><small id="page-tools-status">Enabled on webpages</small></span>
        <input id="page-tools-enabled" type="checkbox" aria-label="Enable page tools">
      </label>
      <section class="collection-section" aria-labelledby="links-heading">
        <header class="collection-toolbar">
          <h2 id="links-heading">Saved links</h2>
          <button class="select-visible" id="select-visible">Select shown</button>
        </header>
        <div class="collection-filters">
          <input id="search" type="search" placeholder="Search links, text, or source" aria-label="Search links">
          <div id="category-filter"></div>
          <div id="sort"></div>
        </div>
        <div class="selection-bar" id="selection-bar" hidden>
          <span id="selection-count"></span>
          <button id="copy-selected" disabled>Copy</button>
          <button id="export-selected" disabled>Export</button>
          <button id="delete-selected" class="danger" disabled>Delete</button>
        </div>
        <details class="collection-tools">
          <summary>Collection tools</summary>
          <div class="collection-tools-actions">
            <button id="copy-all" disabled>Copy all links</button>
            <button id="dedupe">Remove duplicates</button>
            <button id="export-all">Export all links</button>
            <button id="clear" class="danger">Clear collection</button>
          </div>
        </details>
        <p class="notice-bar collection-notice" id="notice" role="status" aria-live="polite" hidden></p>
        <section class="link-list" id="links" aria-label="Captured links"></section>
        <div class="empty" id="empty" hidden><strong>Your collection is empty</strong>Grab links from a page and they’ll show up here.</div>
      </section>
    </main>
    <dialog class="dialog" id="details">
      <h2 id="detail-title"></h2>
      <div id="detail-fields"></div>
      <div class="setting-control">
        <span>Category</span>
        <div id="detail-category"></div>
      </div>
      <div class="dialog-actions">
        <button id="detail-copy">Copy</button>
        <button id="detail-open">Open link</button>
        <button id="detail-remove" class="danger">Remove</button>
        <button id="detail-done">Done</button>
      </div>
    </dialog>
    <dialog class="dialog confirm-dialog" id="confirmation">
      <h2 id="confirmation-title">Confirm action</h2>
      <p id="confirmation-message"></p>
      <div class="dialog-actions">
        <button type="button" id="confirmation-cancel">Cancel</button>
        <button type="button" class="danger" id="confirmation-accept">Continue</button>
      </div>
    </dialog>
    <script src="picker.js"></script>
    <script src="shared.js"></script>
    <script src="collection.js"></script>
  </body>
</html>
